# models.conf — tier → per-harness model settings.
#
# Agents declare a tier (`model: opus|sonnet|haiku|inherit`) in
# .claude/agents/*.md. Tiers are harness-neutral; this file says what each tier
# means for a harness that needs a concrete value. Claude Code accepts the tier
# names natively, so it needs no entries here.
#
# Format:  <harness>.<tier>.<key> = <value>
#   harness  opencode | codex
#   tier     opus | sonnet | haiku
#   key      model  — the harness's model identifier
#            effort — reasoning effort, where the harness exposes one
#
# A tier with no entry for a harness leaves that setting unset, so the agent
# inherits the harness default. `inherit` never emits anything.
#
# Override precedence, lowest to highest:
#   1. this file (shipped defaults)
#   2. ~/.hephaestus/models.conf        (user level — your provider, every project)
#   3. <cwd>/.ai/models.conf            (project level, when run outside this repo)
#   4. $HEPHAESTUS_MODELS               (explicit path)
#
# Layers merge per key, so a user file naming only `codex.opus.model` keeps every
# other shipped default. `--check` on the generators ignores layers 2-4 and
# compares against this file alone, so committed adapters stay reproducible.

# ── OpenCode ─────────────────────────────────────────────────────────────────
# Format is provider/model-id. Repoint these to run the roles on another
# provider — the tier assignments in .claude/agents/ stay unchanged.
opencode.opus.model   = anthropic/claude-opus-5
opencode.sonnet.model = anthropic/claude-sonnet-5
opencode.haiku.model  = anthropic/claude-haiku-4-5-20251001

# ── Codex ────────────────────────────────────────────────────────────────────
# Codex model ids churn faster than its effort levels, and one model at three
# efforts is the closer analogue of a tier ladder than three models. So the
# shipped defaults set effort only and inherit whatever model the session runs.
# Add `codex.<tier>.model = <id>` in an override file to pin models instead.
codex.opus.effort   = high
codex.sonnet.effort = medium
codex.haiku.effort  = low
