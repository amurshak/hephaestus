name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        run: ./tests/run.sh
      - name: Claude adapter drift check
        run: ./scripts/sync-agent-adapters.sh --check
      - name: OpenCode adapter drift check
        run: ./scripts/sync-opencode-adapters.sh --check
      - name: Codex adapter drift check
        run: ./scripts/sync-codex-adapters.sh --check
      - name: Cursor adapter drift check
        run: ./scripts/sync-cursor-adapters.sh --check
      - name: Hermes adapter drift check
        run: ./scripts/sync-hermes-adapters.sh --check
      - name: README composition check
        run: bash tests/check_composition.sh
      - name: Install OpenCode CLI
        run: npm install -g opencode-ai
      - name: OpenCode live load check
        run: bash scripts/verify-opencode-load.sh --require
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Codex live load check
        run: bash scripts/verify-codex-load.sh --require
      # No install step, and no --require: cursor-agent is not on npm (the
      # `cursor-agent` package there is an unrelated third party) and ships only
      # via a vendor install script, so CI has no pinnable source. The step runs
      # and skips; the script's own logic is covered hermetically by a stub CLI
      # in tests/test_cursor_adapters.sh, and the live contract is measured on a
      # developer machine that has the CLI.
      - name: Cursor live load check
        run: bash scripts/verify-cursor-load.sh
