name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        run: ./tests/run.sh
      # Byte-only locale. Assertions that measure text in characters pass here
      # and fail on a contributor's shell, reading as real drift rather than an
      # encoding artifact (#177). The runner's own locale is multibyte-capable,
      # so without this the suite is only ever exercised one way.
      - name: Integration tests (LC_ALL=C)
        run: LC_ALL=C ./tests/run.sh
      - name: Claude adapter drift check
        run: ./scripts/sync-agent-adapters.sh --check
      - name: OpenCode adapter drift check
        run: ./scripts/sync-opencode-adapters.sh --check
      - name: Codex adapter drift check
        run: ./scripts/sync-codex-adapters.sh --check
      - name: Cursor adapter drift check
        run: ./scripts/sync-cursor-adapters.sh --check
      - name: Hermes adapter drift check
        run: ./scripts/sync-hermes-adapters.sh --check
      - name: README composition check
        run: bash tests/check_composition.sh
      - name: Workflow conventions check
        run: bash tests/check_conventions.sh
      - name: Install OpenCode CLI
        run: npm install -g opencode-ai
      - name: OpenCode live load check
        run: bash scripts/verify-opencode-load.sh --require
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Codex live load check
        run: bash scripts/verify-codex-load.sh --require
      # cursor-agent is not on npm — the `cursor-agent` package there is an
      # unrelated third party — so it comes from the vendor installer, which
      # drops it in ~/.local/bin. Unpinned, like the opencode and codex installs
      # above: the check is a canary for the spawn contract, so it has to track
      # what users actually get. `--help` needs no auth, which is all the
      # contract check reads.
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cursor live load check
        run: bash scripts/verify-cursor-load.sh --require
